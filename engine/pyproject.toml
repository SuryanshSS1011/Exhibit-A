[project]
name = "exhibit-a"
version = "0.0.1"
description = "An evidence engine for code that's only allowed to speak with proof."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
public-signatures = ["cryptography>=43"]

[project.scripts]
exhibit-a = "exhibit_a.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exhibit_a"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Pin the rule set explicitly. Ruff's implicit default expanded in 0.16, which
# turned a clean tree red without a code change; declaring it keeps lint results
# tied to this repo's intent rather than the installed ruff version.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Docker-backed tests need a daemon and pull an image, so they are opt-in: `pytest`
# deselects them and `pytest -m docker` runs only them (the last -m wins).
addopts = "-m \"not docker\""
markers = ["docker: exercises a real Docker daemon"]
