name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.11, so every claimed version is tested.
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,public-signatures]"
      - name: Lint
        # Style is version-independent; one run is enough to gate it.
        if: matrix.python-version == '3.12'
        run: ruff check .
      - name: Format check
        if: matrix.python-version == '3.12'
        run: ruff format --check .
      - name: Test
        run: python -m pytest -q

  sandbox:
    # Every other job fakes the Docker daemon, which proves the argv we build but not
    # that a daemon accepts it. This is the only job that runs the real executor.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,public-signatures]"
      - name: Sandbox integration
        run: python -m pytest -m docker -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
